apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediplus-deployment
  namespace: mediplus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediplus
  template:
    metadata:
      labels:
        app: mediplus
    spec:
      containers:
        - name: mediplus
          image: abintony/mediplus:latest
          ports:
            - containerPort: 8000
